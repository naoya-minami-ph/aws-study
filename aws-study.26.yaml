AWSTemplateFormatVersion: "2010-09-09"
Description: AWS-study template

Parameters:
  MyIP:
    Type: String
    Default: 175.176.67.202
    Description: Your IP address for SSH access
  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS master password
    MinLength: 8
  NotificationEmail:
    Type: String
    Description: Email address for alarm notifications

Resources:
# VPC
  myVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: aws-study-vpc

# Subnet
  SubnetAZ1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref myVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: ap-northeast-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: aws-study-subnet1a

# Subnet2
  SubnetAZ1c:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref myVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: ap-northeast-1c
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: aws-study-subnet1c

# RDS用プライベートサブネット
  SubnetPrivateAZ1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref myVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: ap-northeast-1a
      MapPublicIpOnLaunch: false    # ← プライベート
      Tags:
        - Key: Name
          Value: aws-study-subnet-private-1a

  SubnetPrivateAZ1c:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref myVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: ap-northeast-1c
      MapPublicIpOnLaunch: false    # ← プライベート
      Tags:
        - Key: Name
          Value: aws-study-subnet-private-1c

# InternetGateway
  myIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: aws-study-gw

# VPCgatewayAttachment
  gatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref myVPC
      InternetGatewayId: !Ref myIGW

# Route Table
  myRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref myVPC
      Tags:
        - Key: Name
          Value: aws-study-route

  myprivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref myVPC
      Tags:
        - Key: Name
          Value: aws-study-private-route

  RouteInternet:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref myRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref myIGW

# Subnetにルートテーブルを関連付け
  RouteLocal:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetAZ1a
      RouteTableId: !Ref myRouteTable

  RouteLocal2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetAZ1c
      RouteTableId: !Ref myRouteTable

  PrivateRouteAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPrivateAZ1a
      RouteTableId: !Ref myprivateRouteTable

  PrivateRouteAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPrivateAZ1c
      RouteTableId: !Ref myprivateRouteTable 

# Security Group EC2
  mySGEC2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: aws-study-sg-ec2
      GroupDescription: Allow SSH, HTTP inbound
      VpcId: !Ref myVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${MyIP}/32"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref mySGALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: aws-study-sg-ec2

# Security Group RDS
  mySGRDS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: aws-study-sg-rds
      GroupDescription: Allow MySQL 3306 inbound from EC2
      VpcId: !Ref myVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref mySGEC2
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: aws-study-sg-rds

# Security Group ALB（新規追加）
  mySGALB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: aws-study-sg-alb
      GroupDescription: Allow HTTP 80 inbound
      VpcId: !Ref myVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: aws-study-sg-alb

# EC2
  myEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
      InstanceType: t3.micro
      SubnetId: !Ref SubnetAZ1a
      DisableApiTermination: false
      InstanceInitiatedShutdownBehavior: stop
      KeyName: nan.tt0105
      Monitoring: false
      SecurityGroupIds:
        - !Ref mySGEC2
      Tags:
        - Key: Name
          Value: aws-study-ec2

# RDS
  myRDS:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t4g.micro
      Port: 3306
      StorageType: gp2
      BackupRetentionPeriod: 1
      MasterUsername: root
      MasterUserPassword: !Ref DBPassword
      PreferredBackupWindow: 22:00-23:00
      PreferredMaintenanceWindow: sun:18:00-sun:19:00
      DBName: awsstudy
      Engine: mysql
      LicenseModel: general-public-license
      DBSubnetGroupName: !Ref myDBSubnetGroup
      VPCSecurityGroups:
        - !Ref mySGRDS
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: aws-study-rds

  myDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Created from the RDS Management Console
      SubnetIds:
        - !Ref SubnetPrivateAZ1a
        - !Ref SubnetPrivateAZ1c

# ALB
  myELB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: aws-study-alb
      SecurityGroups:
        - !Ref mySGALB
      Subnets:
        - !Ref SubnetAZ1a
        - !Ref SubnetAZ1c
      Tags:
        - Key: Name
          Value: aws-study-elb

  myELBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aws-study-elb-target-group
      Port: 80
      Protocol: HTTP
      VpcId: !Ref myVPC
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckTimeoutSeconds: 5
      HealthCheckProtocol: HTTP
      HealthCheckPath: "/"
      HealthCheckPort: "traffic-port"
      HealthCheckIntervalSeconds: 10
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: aws-study-elb-target-group
      Targets:
        - Id: !Ref myEC2
          Port: 80

  ELBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref myELB
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref myELBTargetGroup
      Port: 80
      Protocol: HTTP

  myEC2CPUUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "aws-study-cpu-utilization-alarm"
      AlarmDescription: "Aws-study-ec2 のCPU使用率が5%以上になりました"

      Namespace: "AWS/EC2"
      Dimensions:
        - Value: !Ref myEC2
          Name: "InstanceId"
      MetricName: "CPUUtilization"
      Unit: "Percent"

      Period: 300
      Statistic: "Average"

      Threshold: 5
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: "missing"

      ActionsEnabled: True
      AlarmActions:
        - !Ref mySNSTopic

  myWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: aws-study-webacl
      Scope: REGIONAL   # ← ALBは必ず REGIONAL
      DefaultAction:
        Allow: {}

      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
